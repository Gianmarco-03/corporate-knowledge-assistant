# Workspace isolato degli spike tecnici (fase 01). Non esiste un Cargo.toml alla
# radice del repo: il codice usa-e-getta resta fuori da hook e prodotto.

[workspace]
resolver = "3"
members = ["common", "s01-upload", "s02-parser", "s03-pgvector", "s04-jev", "s05-cancel", "s06-llm", "s07-ports"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# Coda append-only: una slice che ha bisogno di una dipendenza nuova la aggiunge
# in fondo, con versione esatta "=x.y.z" e crate approvato, senza toccare le voci
# esistenti (WIRING W2).
axum = { version = "=0.8.9", features = ["multipart", "http2"] }
tower-http = { version = "=0.7.1", features = ["limit", "timeout", "trace"] }
tokio = { version = "=1.53.3", features = ["full"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
object_store = { version = "=0.14.2", features = ["aws"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "migrate", "macros"] }
pgvector = { version = "=0.4.2", features = ["sqlx", "halfvec"] }
pdfium-render = { version = "=0.9.4" }
reqwest = { version = "=0.13.5", features = ["json", "stream", "zstd", "multipart"] }
wiremock = { version = "=0.6.5" }
dhat = { version = "=0.3.3" }
tempfile = { version = "=3.27.0" }
sha2 = { version = "=0.11.1" }
rlimit = { version = "=0.11.0" }
nix = { version = "=0.31.3", features = ["signal", "process"] }
futures = { version = "=0.3.34" }
hdrhistogram = { version = "=7.6.0" }
serde_json = { version = "=1.0.154" }
clap = { version = "=4.6.7", features = ["derive"] }
anyhow = { version = "=1.0.104" }
sysinfo = { version = "=0.39.6" }
bytes = { version = "=1.12.1" }
lopdf = { version = "=0.45.0" }
serde = { version = "=1.0.229", features = ["derive"] }
csv = { version = "=1.4.0" }
hex = { version = "=0.4.3" }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
rand = { version = "=0.10.3" }
flate2 = { version = "=1.1.10" }
zip = { version = "=9.0.5" }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
async-trait = { version = "=0.1.92" }
unicode-normalization = { version = "=0.1.26" }
quick-xml = { version = "=0.42.0" }
